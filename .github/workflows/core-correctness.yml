name: AFDS Core Correctness
on:
  workflow_dispatch:
  push:
    paths:
      - "afds/shortest_path.py"
      - "tests/test_pairwise_nonnegative.py"
      - ".github/workflows/core-correctness.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Pairwise constrained-model oracle tests
        run: python -m pytest -q tests/test_pairwise_nonnegative.py tests/test_afds.py
