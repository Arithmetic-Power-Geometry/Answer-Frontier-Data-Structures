name: AFDS Active Locality Attack
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/find_active_locality_counterexample.py"
      - "afds/shortest_path.py"
      - ".github/workflows/active-locality.yml"
jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m scripts.find_active_locality_counterexample
      - run: cat artifacts/active_locality_adversarial.json
      - uses: actions/upload-artifact@v4
        with:
          name: afds-active-locality
          path: artifacts/active_locality_adversarial.json
          retention-days: 90
