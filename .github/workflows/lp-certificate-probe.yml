name: AFDS LP Certificate Probe
on:
  workflow_dispatch:
  push:
    paths:
      - "afds/shortest_path.py"
      - "scripts/probe_lp_certificate.py"
      - ".github/workflows/lp-certificate-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m scripts.probe_lp_certificate
      - run: cat artifacts/lp_certificate_probe.json
