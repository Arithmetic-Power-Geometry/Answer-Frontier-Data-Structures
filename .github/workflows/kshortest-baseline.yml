name: AFDS K-Shortest Baseline
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/compare_kshortest.py"
      - ".github/workflows/kshortest-baseline.yml"
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m scripts.compare_kshortest
      - run: cat artifacts/kshortest_vs_afds.json
      - uses: actions/upload-artifact@v4
        with:
          name: afds-kshortest-baseline
          path: artifacts/kshortest_vs_afds.*
          retention-days: 90
