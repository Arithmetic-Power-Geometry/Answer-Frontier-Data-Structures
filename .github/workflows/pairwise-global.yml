name: AFDS Pairwise Global
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/pairwise_global_baseline.py"
      - ".github/workflows/pairwise-global.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m scripts.pairwise_global_baseline
      - run: cat artifacts/pairwise_global_baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: pairwise-global-baseline
          path: artifacts/pairwise_global_baseline.json
